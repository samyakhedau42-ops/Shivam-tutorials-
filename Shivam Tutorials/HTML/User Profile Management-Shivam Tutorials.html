<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Shivam Tutorials</title>
    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/nav.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/jpeg" href="../media/STlogo.png.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="../media/STlogo.png.jpeg">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JAVASCRIPT/project.js"></script>
</head>
<body class="body" id="body">
    <div id="header"></div>
    <div id="navbar"></div>

    <main class="container my-5" style="min-height: 50vh;">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 p-0" style="border-radius: 12px; border-left: none; margin-top: 1rem;">
                    <div style="background: linear-gradient(135deg, var(--primary-dark) 0%, #0f3a5e 100%); padding: 2.5rem 2rem; text-align: center; color: white;">
                        <div class="position-relative d-inline-block mb-3">
                            <img id="profileImage" class="rounded-circle shadow-sm" width="100" height="100" style="object-fit: cover; border: 3px solid white;" alt="Profile Picture">
                            <label for="photoUpload" style="cursor: pointer; position: absolute; bottom: 0; right: 0; background: var(--accent-blue); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white;" title="Change photo">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera-fill" viewBox="0 0 16 16">
                                    <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                                    <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2zm.5 4a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                                </svg>
                            </label>
                            <input type="file" id="photoUpload" class="d-none" accept="image/png, image/jpeg, image/gif">
                        </div>
                        <h2 class="mb-1 fw-bold" id="profileName" style="color: white !important;">User Profile</h2>
                        <span id="profileRoleBadge" class="badge bg-light text-dark px-3 py-2 rounded-pill mt-2 fw-semibold shadow-sm">Registered User</span>
                    </div>
                    <div class="card-body p-4 bg-white">
                        <div class="mb-4 mt-2 text-center">
                            <label class="text-muted fw-bold text-uppercase mb-1" style="font-size: 0.85rem; letter-spacing: 1.5px;">Email Address</label>
                            <p class="fs-5 text-dark mb-0 fw-medium" id="profileEmail">Loading Data...</p>
                            <div class="mt-3 d-flex justify-content-center gap-3">
                                <button id="editProfileBtn" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold shadow-sm">Edit Profile</button>
                                <a href="#" id="signOutBtn" class="btn btn-danger px-4 py-2 rounded-pill fw-semibold shadow-sm text-decoration-none">Sign Out</a>
                            </div>
                        </div>
                        
                        <div id="adminPanel" style="display: none;" class="mt-5 text-start">
                            <hr class="my-4" style="opacity: 0.1;">
                            <h5 class="fw-bold text-dark mb-3 text-center text-danger">Admin Panel</h5>
                            <div class="d-flex justify-content-center">
                                <button id="assignAdminBtn" class="btn btn-outline-danger px-4 py-2 rounded-pill fw-semibold shadow-sm btn-admin-assign">Assign Admin Role</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProfileModalLabel">Edit My Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editProfileForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="editFirstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="editFirstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editLastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="editLastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="editEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="editPassword" placeholder="Leave blank to keep current password">
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        $(function () {
            loadSiteComponents();
            
            const defaultPageAvatar = `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="var(--accent-blue)" class="bi bi-person-circle" viewBox="0 0 16 16"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/></svg>')}`;
            const profileImageEl = $("#profileImage");
            let currentUser = null;
            const usersDatabase = JSON.parse(localStorage.getItem('usersList')) || [];

            // Retrieve and display the currently logged-in user's details
            const { email: currentUserEmail } = getCurrentUserSession();
            const isAdmin = isCurrentUserAdmin();

            if (currentUserEmail && usersDatabase.length > 0) {
                currentUser = usersDatabase.find(user => user.email === currentUserEmail);
                if (currentUser) {
                const currentUserName = `${currentUser.firstName || ''} ${currentUser.lastName || ''}`.trim();
                $("#profileName").text(currentUserName || "User Profile");
                $("#profileEmail").text(currentUser.email);
                profileImageEl.attr('src', currentUser.profilePicture || defaultPageAvatar);
                
                if (isAdmin) {
                    $("#adminPanel").show();
                    $("#profileRoleBadge").removeClass('bg-light text-dark').addClass('bg-danger text-white').text('Admin');
                    $("#profileName").html(`${currentUserName || 'Admin'} <span class="badge bg-danger rounded-pill align-middle" style="font-size: 0.7rem; vertical-align: middle;">ADMIN</span>`);
                } else {
                    $("#profileRoleBadge").removeClass('bg-danger text-white').addClass('bg-light text-dark').text('Registered User');
                }
                }
            } else {
                $("#profileName").text("User Profile");
                $("#profileEmail").text("No user data found");
                $("#profileRoleBadge").removeClass('bg-danger text-white').addClass('bg-light text-dark').text('Registered User');
                profileImageEl.attr('src', defaultPageAvatar);
            }

            // Handle photo upload
            $("#photoUpload").on("change", function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageData = event.target.result;
                    profileImageEl.attr('src', imageData);

                    if (currentUser) {
                        currentUser.profilePicture = imageData;
                        localStorage.setItem('usersList', JSON.stringify(usersDatabase));
                        Swal.fire('Success', 'Profile photo updated successfully!', 'success');
                        // This function is in project.js to update the navbar icon
                        updateNavbarProfileIcon(imageData); 
                    } else {
                    Swal.fire('Error', "No logged-in user found to save the photo.", 'error');
                    }
                };
                reader.readAsDataURL(file);
            });

            // Handle Edit Profile Modal
            $("#editProfileBtn").on("click", function(e) {
                e.preventDefault();
                if (currentUser) {
                    $("#editFirstName").val(currentUser.firstName);
                    $("#editLastName").val(currentUser.lastName);
                    $("#editEmail").val(currentUser.email);
                    $("#editPassword").val("");
                    const editProfileModal = new bootstrap.Modal(document.getElementById('editProfileModal'));
                    editProfileModal.show();
                }
            });

            // Handle Edit Profile Form Submission
            $("#editProfileForm").on("submit", function(e) {
                e.preventDefault();
                const newFirstName = $("#editFirstName").val().trim();
                const newLastName = $("#editLastName").val().trim();
                const newEmail = $("#editEmail").val().trim();
                const newPassword = $("#editPassword").val();

                if (newEmail !== currentUser.email && usersDatabase.some(u => u.email === newEmail)) {
                Swal.fire('Email in Use', "This email is already registered to another account.", 'warning');
                    return;
                }

                currentUser.firstName = newFirstName;
                currentUser.lastName = newLastName;
                
                const storage = getAuthStorage();
                if (newEmail !== currentUser.email) {
                    currentUser.email = newEmail;
                    storage.setItem('currentUserEmail', newEmail);
                }
                if (newPassword) {
                    currentUser.password = newPassword;
                }

                localStorage.setItem('usersList', JSON.stringify(usersDatabase));
                Swal.fire('Success!', "Profile updated successfully!", 'success');

                const currentUserName = `${currentUser.firstName} ${currentUser.lastName}`;
                $("#profileName").html(currentUserName + (isAdmin ? ' <span class="badge bg-danger rounded-pill align-middle" style="font-size: 0.7rem; vertical-align: middle;">ADMIN</span>' : ''));
                $("#profileEmail").text(currentUser.email);

                const modalEl = document.getElementById("editProfileModal");
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            });

            // Handle Assigning Admin
            $("#assignAdminBtn").on("click", function(e) {
                e.preventDefault();
                Swal.fire({
                    title: 'Assign Admin Role',
                    input: 'email',
                    inputLabel: 'Enter the email of the user to grant admin privileges:',
                    inputPlaceholder: 'user@example.com',
                    showCancelButton: true,
                    confirmButtonText: 'Grant Admin',
                    confirmButtonColor: '#dc3545',
                    preConfirm: (email) => {
                        if (!email || !email.includes('@')) {
                            Swal.showValidationMessage('Please enter a valid email address.');
                            return false;
                        }
                        return email.trim().toLowerCase();
                    }
                }).then((result) => {
                    if (result.isConfirmed && result.value) {
                        const emailToMakeAdmin = result.value;
                        const userIndex = usersDatabase.findIndex(u => u.email === emailToMakeAdmin);
                        if (userIndex !== -1) {
                            if (usersDatabase[userIndex].role === 'admin') {
                                Swal.fire('Already Admin', `${emailToMakeAdmin} is already an administrator.`, 'info');
                            } else {
                                usersDatabase[userIndex].role = 'admin';
                                localStorage.setItem('usersList', JSON.stringify(usersDatabase));
                                Swal.fire('Success!', `Admin privileges granted to ${emailToMakeAdmin}.`, 'success');
                            }
                        } else {
                            Swal.fire('Not Found', `No registered user found with the email ${emailToMakeAdmin}.`, 'error');
                        }
                    }
                });
            });

            // Handle Sign Out properly
            $("#signOutBtn").on("click", function (e) {
                e.preventDefault();
                signOut(); // Centralized function from project.js
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
