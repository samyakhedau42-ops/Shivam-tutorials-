    <style>
        .standards-nav .nav-link {
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 0.25rem;
            transition: all 0.3s ease;
            font-weight: 600;
            border-radius: 50rem; /* pill shape */
        }
        .standards-nav .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .standards-nav .nav-link.active {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        #portionContent {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 2rem;
            text-align: left;
            min-height: 30vh;
            transition: opacity 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }
        #portionTitle {
            color: var(--primary-dark);
        }
        #portionDetails .list-group {
            margin-top: 1rem;
        }
        #portionDetails .list-group-item {
            background: transparent;
            color: white;
            border-color: rgba(255, 255, 255, 0.2) !important;
            padding-left: 0.5rem;
        }
        #portionDetails .card-text {
            color: rgba(255, 255, 255, 0.9);
        }
        #portionDetails .list-group-item.sub-item {
            padding-left: 1.5rem;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        #portionDetails .list-group-item.sub-item::before {
            content: '↳';
            margin-right: 0.75rem;
            opacity: 0.8;
        }
        .list-group-item.clickable-subject {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .list-group-item.clickable-subject:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .list-group-item.clickable-subject::after {
            content: '›';
            float: right;
            font-weight: bold;
            font-size: 1.5em;
            line-height: 0.8;
            color: var(--accent-blue);
        }
        .term-nav .nav-link {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            border: none;
            border-bottom: 2px solid transparent;
        }
        .term-nav .nav-link.active {
            color: white;
            background-color: transparent;
            border-bottom: 2px solid var(--accent-blue);
        }
    </style>
</head>

                        { name: 'Marathi', lessons: ['1. तू बुद्धी दे', '2. संतवाणी', '3. शाल', '4. उपास'] },
                        { name: 'Hindi', lessons: ['1. भारत महिमा', '2. लक्ष्मी', '3. वाह रे, हमदर्द!', '4. मन'] },
                        { name: 'Maths', lessons: ['Algebra: 1. Linear Equations in Two Variables, 2. Quadratic Equations, 3. Arithmetic Progression', 'Geometry: 1. Similarity, 2. Pythagoras Theorem, 3. Circle'] },
                        { name: 'Science', lessons: ['Part 1: 1. Gravitation, 2. Periodic Classification of Elements, 3. Chemical Reactions and Equations', 'Part 2: 1. Heredity and Evolution, 2. Life Processes in Living Organisms Part -1'] },
                        { name: 'History', lessons: ['1. Historiography: Development in the West', '2. Historiography: Indian Tradition', '3. Applied History'], subs: [
                            { name: 'Civics (Political Science)', lessons: ['1. Working of the Constitution', '2. The Electoral Process'] }
                        ]},
                        { name: 'Geography', lessons: ['1. Field Visit', '2. Location and Extent', '3. Physiography and Drainage'], subs: [
                            { name: 'Economics', lessons: ['1. Development', '2. Sectors of the Indian Economy'] }
                        ]}
                    ],
                    'Second Term': [
                        { name: 'English', lessons: ['Unit 3: 3.1 If, 3.2 A Lesson in Life from a Beggar', 'Unit 4: 4.1 The World is Mine, 4.2 Bholi'] },
                        { name: 'Marathi', lessons: ['5. मोठे होत असलेल्या मुलांनो...', '6. वस्तू', '7. गवताचे पाते', '8. वाट पाहताना'] },
                        { name: 'Hindi', lessons: ['5. गोवा : जैसा मैंने देखा', '6. गिरिधर नागर', '7. खुला आकाश', '8. गजल'] },
                        { name: 'Maths', lessons: ['Algebra: 4. Financial Planning, 5. Probability, 6. Statistics', 'Geometry: 4. Geometric Constructions, 5. Co-ordinate Geometry, 6. Trigonometry, 7. Mensuration'] },
                        { name: 'Science', lessons: ['Part 1: 4. Effects of electric current, 5. Heat, 6. Refraction of light', 'Part 2: 3. Life Processes in Living Organisms Part -2, 4. Environmental management, 5. Towards Green Energy'] },
                        { name: 'History', lessons: ['4. History of Indian Arts', '5. Mass Media and History', '6. Entertainment and History'], subs: [
                            { name: 'Civics (Political Science)', lessons: ['3. Political Parties', '4. Social and Political Movements'] }
                        ]},
                        { name: 'Geography', lessons: ['4. Climate', '5. Natural Vegetation and Wildlife', '6. Population'], subs: [
                            { name: 'Economics', lessons: ['3. Money and Credit', '4. Globalization and the Indian Economy'] }
                        ]}
                    ]
                }
            };

            const standardsNav = $('#standardsNav');
            const termNav = $('#termNav');
            const portionTitle = $('#portionTitle');
            const portionDetails = $('#portionDetails');
            const portionContent = $('#portionContent');

            function getOrdinal(n) {
                const s = ["th", "st", "nd", "rd"];
                const v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            }

            function renderSubjects(subjects, standard, term) {
                if (subjects && subjects.length > 0) {
                    const subjectListHtml = `
                        <p class="card-text">The following subjects are covered for this term:</p>
                        <ul class="list-group list-group-flush">
                            ${subjects.map((subject, subjectIndex) => {
                                if (typeof subject === 'object' && subject.name) {
                                    const hasLessons = subject.lessons && subject.lessons.length > 0;
                                    const clickableClass = hasLessons ? 'clickable-subject' : '';
                                    const dataAttributes = hasLessons ? `data-standard="${standard}" data-term="${term}" data-subject-index="${subjectIndex}"` : '';
                                    
                                    let subListHtml = '';
                                    if (subject.subs && subject.subs.length > 0) {
                                        subListHtml = `<ul class="list-group list-group-flush ps-3" style="margin-top: 0.25rem;">
                                            ${subject.subs.map((sub, subIndex) => {
                                                const hasSubLessons = sub.lessons && sub.lessons.length > 0;
                                                const clickableSubClass = hasSubLessons ? 'clickable-subject' : '';
                                                const subDataAttributes = hasSubLessons ? `data-standard="${standard}" data-term="${term}" data-subject-index="${subjectIndex}" data-sub-index="${subIndex}"` : '';
                                                return `<li class="list-group-item sub-item ${clickableSubClass}" ${subDataAttributes}>${sub.name}</li>`;
                                            }).join('')}
                                        </ul>`;
                                    }
                                    return `<li class="list-group-item ${clickableClass}" ${dataAttributes}>${subject.name}${subListHtml}</li>`;
                                }
                                return '';
                            }).join('')}
                        </ul>
                    `;
                    portionDetails.html(subjectListHtml);
                } else {
                    portionDetails.html(`<p class="card-text">Syllabus details for this term will be updated here soon.</p>`);
                }
            }

            termNav.on('click', 'a', function(e) {
                e.preventDefault();
                termNav.find('a').removeClass('active');
                $(this).addClass('active');

                const standard = standardsNav.find('.active').data('standard');
                const term = $(this).data('term');
                const subjects = portionData[standard]?.[term] || [];
                
                renderSubjects(subjects, standard, term);
            });

            standardsNav.on('click', 'a', function(e) {
                e.preventDefault();
                
                standardsNav.find('a').removeClass('active');
                $(this).addClass('active');

                const standard = $(this).data('standard');
                const standardOrdinal = getOrdinal(standard);
                
                portionContent.css('opacity', 0);
                setTimeout(() => {
                    portionTitle.text(`Portion for ${standardOrdinal} Standard`);
                    termNav.show();
                    // Trigger click on the first term to load its data by default
                    termNav.find('a:first').trigger('click');
                    portionContent.css('opacity', 1);
                }, 200);
            });

            // Set initial state by activating the first standard, which will then activate the first term
            if (standardsNav.find('a').length > 0) {
                standardsNav.find('a:first').trigger('click');
            }

            // Handle clicking on a subject to show lessons
            $('#portionDetails').on('click', '.clickable-subject', function() {
                const standard = $(this).data('standard');
                const term = $(this).data('term');
                const subjectIndex = $(this).data('subject-index');
                const subIndex = $(this).data('sub-index');

                const termData = portionData[standard]?.[term] || [];
                const subjectData = termData[subjectIndex];
                let targetSubject;

                if (!subjectData) return;

                if (subIndex !== undefined && subjectData.subs) {
                    targetSubject = subjectData.subs[subIndex];
                } else {
                    targetSubject = subjectData;
                }

                if (!targetSubject) return;

                const lessons = targetSubject.lessons || [];

                if (lessons.length > 0) {
                    const lessonsHtml = `<ul class="list-group list-group-flush">${lessons.map(lesson => `<li class="list-group-item" style="background: transparent; border-color: rgba(0,0,0,0.1);">${lesson}</li>`).join('')}</ul>`;
                    Swal.fire({
                        title: `Lessons for ${targetSubject.name}`,
                        html: lessonsHtml,
                        confirmButtonText: 'Close',
                        confirmButtonColor: '#0284c7',
                        width: '600px',
                        customClass: {
                            htmlContainer: 'text-start'
                        }
                    });
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
