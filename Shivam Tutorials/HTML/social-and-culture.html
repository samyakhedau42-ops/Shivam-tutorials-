<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social and Culture - Shivam Tutorials</title>
    <link rel="stylesheet" href="../CSS/nav.css">
    <link rel="shortcut icon" type="image/jpeg" href="../media/STlogo.png.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JAVASCRIPT/project.js"></script>
    <style>
        body {
            background: linear-gradient(180deg, #0f2540 0%, #123d5a 100%);
            color: #eaf7ff;
        }
        .content-card {
            max-width: 1100px;
            margin: 2.5rem auto;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(140, 200, 255, 0.4);
            border-radius: 18px;
            padding: 2rem 2.25rem 2.5rem;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
            color: #0f2540;
        }
    </style>
</head>
<body>

    <div id="header"></div>
    <div id="navbar"></div>

    <main class="container my-5">
        <div class="content-card">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h1 class="mb-0">Social and Culture</h1>
                <!-- Admin-only button, shown by JS -->
                <button id="addSocialPostBtn" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#socialPostModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle-fill me-1" viewBox="0 0 16 16"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3v-3z"/></svg>
                    Add Post
                </button>
            </div>
            <p class="lead">This section is dedicated to social events and cultural activities at Shivam Tutorials.</p>
            <hr>
            <!-- Dynamic content will be loaded here -->
            <div id="social-content-container">
                <p class="text-muted text-center mt-4">Loading events...</p>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Modal for Admin to Add/Edit Posts -->
    <div class="modal fade" id="socialPostModal" tabindex="-1" aria-labelledby="socialPostModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="socialPostModalLabel">Add New Social/Cultural Post</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="socialPostForm">
              <div class="mb-3">
                <label for="postTitle" class="form-label">Post Title</label>
                <input type="text" class="form-control" id="postTitle" required>
              </div>
              <div class="mb-3">
                <label for="postDescription" class="form-label">Description</label>
                <textarea class="form-control" id="postDescription" rows="5" required></textarea>
              </div>
              <div class="mb-3">
                <label for="postMediaUrl" class="form-label">Image or Video URL (Optional)</label>
                <div class="input-group">
                  <input type="url" class="form-control" id="postMediaUrl" placeholder="https://example.com/image.jpg or https://youtube.com/watch?v=...">
                  <button class="btn btn-outline-info d-flex align-items-center gap-1" type="button" id="generateAiSummaryBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-robot" viewBox="0 0 16 16"><path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM11 10.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5Zm-6 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5Z"/><path d="M12.5 0A3.5 3.5 0 0 0 9 3.5V5H7V3.5A3.5 3.5 0 0 0 3.5 0 3.5 3.5 0 0 0 0 3.5V13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3.5A3.5 3.5 0 0 0 12.5 0ZM1 3.5A2.5 2.5 0 0 1 3.5 1 2.5 2.5 0 0 1 6 3.5V5H1V3.5ZM15 13a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6h14v7Z"/></svg>
                    AI Summary
                  </button>
                </div>
              </div>
              <div class="text-center my-2 text-muted small">OR</div>
              <div class="mb-3">
                <label for="postMediaFile" class="form-label">Upload from Device (Optional)</label>
                <input class="form-control" type="file" id="postMediaFile" accept="image/*,video/mp4,video/webm,video/ogg">
                <div class="form-text text-warning">Note: Large files, especially videos, may not save correctly due to browser storage limits.</div>
              </div>
              <div class="mb-3">
                <label for="postDate" class="form-label">Event Date (Optional)</label>
                <input type="date" class="form-control" id="postDate">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" form="socialPostForm" class="btn btn-primary">Save Post</button>
          </div>
        </div>
      </div>
    </div>

    <script>
        $(function() {
            loadSiteComponents();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
